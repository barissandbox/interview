[package]
name = "interview"
version = "1.1.1"
edition = "2024"
description = "Live desktop interview assistant using Deepgram and ChatGPT"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
crossbeam-channel = "0.5"
dirs = "6.0"
futures-util = "0.3"
http = "1.3"
log = { version = "0.4", features = ["std"] }
pdf-extract = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = "2"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2.1"

[build-dependencies]
tauri-build = "2"

[patch.crates-io]
typeid = { path = "vendor/typeid" }

[profile.release]
strip = true
lto = "thin"
